
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IPL Ticket Booking</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <header>
        <h1>IPL 2026</h1>
        <nav>
            <a href="index.html">Home</a>
            <a href="booking.html">Book Ticket</a>
        </nav>
    </header>

    <main>
        <h2>IPL Ticket Booking Form</h2>

        <p>Book your tickets and experience the stadium energy live!</p>

        <form id="bookingForm" action="#" method="get">

            <label for="name">Full Name:</label>
            <input type="text" id="name" name="name"
                   placeholder="Enter your name"
                   minlength="3" maxlength="30"
                   required>

            <br><br>

            <label for="email">Email Address:</label>
            <input type="email" id="email" name="email"
                   placeholder="Enter your email"
                   required>

            <br><br>

            <label for="phone">Phone Number:</label>
            <input type="tel" id="phone" name="phone"
                   placeholder="Enter 10 digit phone number"
                   pattern="[0-9]{10}"
                   maxlength="10"
                   required>

            <br><br>

            <label for="match">Select Match:</label>
            <select id="match" name="match" required>
                <option value="">-- Select Match --</option>
                <option value="RCB vs CSK">RCB vs CSK</option>
                <option value="MI vs KKR">MI vs KKR</option>
                <option value="RCB vs MI">RCB vs MI</option>
                <option value="CSK vs KKR">CSK vs KKR</option>
            </select>

            <br><br>

            <label for="stand">Stand Category:</label>
            <select id="stand" name="stand" required>
                <option value="">-- Select Stand --</option>
                <option value="General">General</option>
                <option value="Premium">Premium</option>
                <option value="VIP">VIP</option>
            </select>

            <br><br>

            <label for="tickets">Number of Tickets:</label>
            <input type="number" id="tickets" name="tickets"
                   min="1" max="10"
                   placeholder="Enter ticket quantity"
                   required>

            <br><br>

            <label>Booking Preference:</label>
            <br>

            <input type="radio" id="online"
                   name="preference"
                   value="Online Payment" required>
            <label for="online">Online Payment</label>

            <input type="radio" id="counter"
                   name="preference"
                   value="Pay at Counter">
            <label for="counter">Pay at Counter</label>

            <br><br>

            <input type="checkbox" id="terms"
                   name="terms"
                   value="accepted" required>
            <label for="terms">
                I agree to the booking terms and conditions.
            </label>

            <br><br>

            <button type="submit">Submit Booking</button>
            <button type="reset">Reset</button>

        </form>

        <p id="message"></p>

    </main>

    <script>

        const form = document.getElementById("bookingForm");
        const message = document.getElementById("message");

        form.addEventListener("submit", function(event) {

            event.preventDefault();

            message.style.color = "red";

            if (!form.checkValidity()) {

                form.reportValidity();

                message.textContent =
                    "Please enter all details correctly!";

            } else {

                message.style.color = "green";

                message.textContent =
                    "Your booking details are valid!";

            }

        });

        form.addEventListener("reset", function() {
            message.textContent = "";
        });

    </script>

</body>
</html>
