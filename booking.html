
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IPL Ticket Booking</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <header>
        <h1>IPL 2026</h1>
        <nav>
            <a href="index.html">Home</a>
            <a href="booking.html">Book Ticket</a>
        </nav>
    </header>

    <main>
        <h2>IPL Ticket Booking Form</h2>
        <p>Book your tickets and experience the stadium energy live!</p>

        <form action="booking.html" method="get">

            <label>Full Name:</label>
            <input type="text" name="name"
                   placeholder="Enter your name"
                   minlength="3" maxlength="30" required>

            <br><br>

            <label>Email Address:</label>
            <input type="email" name="email"
                   placeholder="Enter your email"
                   required>

            <br><br>

            <label>Phone Number:</label>
            <input type="tel" name="phone"
                   placeholder="10 digit phone number"
                   pattern="[0-9]{10}"
                   maxlength="10" required>

            <br><br>

            <label>Select Match:</label>
            <select name="match" required>
                <option value="">-- Select Match --</option>
                <option value="RCB vs CSK">RCB vs CSK</option>
                <option value="MI vs KKR">MI vs KKR</option>
                <option value="RCB vs MI">RCB vs MI</option>
                <option value="CSK vs KKR">CSK vs KKR</option>
            </select>

            <br><br>

            <label>Stand Category:</label>
            <select name="stand" required>
                <option value="">-- Select Stand --</option>
                <option value="General">General</option>
                <option value="Premium">Premium</option>
                <option value="VIP">VIP</option>
            </select>

            <br><br>

            <label>Number of Tickets:</label>
            <input type="number" name="tickets"
                   min="1" max="10"
                   placeholder="Enter ticket quantity"
                   required>

            <br><br>

            <label>Booking Preference:</label><br>

            <input type="radio" name="preference"
                   value="Online Payment" required>
            Online Payment

            <input type="radio" name="preference"
                   value="Pay at Counter">
            Pay at Counter

            <br><br>

            <input type="checkbox" name="terms"
                   value="accepted" required>
            I agree to the booking terms and conditions.

            <br><br>

            <button type="submit">Submit Booking</button>
            <button type="reset">Reset</button>

        </form>
    </main>

</body>
</html>
