
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IPL Ticket Booking</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>🏏 IPL Ticket Booking</h1>
        <p>Book your favourite IPL match tickets!</p>
    </header>

    <main class="container">

        <section class="booking-card">
            <h2>Book Your Tickets</h2>

            <label for="match">Select Match</label>
            <select id="match">
                <option value="RCB vs CSK">RCB vs CSK</option>
                <option value="MI vs KKR">MI vs KKR</option>
                <option value="SRH vs RR">SRH vs RR</option>
                <option value="GT vs PBKS">GT vs PBKS</option>
            </select>

            <label for="stand">Select Stand Category</label>
            <select id="stand">
                <option value="500">General - ₹500</option>
                <option value="1000">Premium - ₹1000</option>
                <option value="2000">VIP - ₹2000</option>
            </select>

            <label for="quantity">Number of Tickets</label>
            <input
                type="number"
                id="quantity"
                min="1"
                max="10"
                value="1"
            >

            <button type="button" id="bookBtn">Confirm Booking</button>
        </section>

        <section class="summary-card">
            <h2>Booking Summary</h2>

            <p><strong>Match:</strong>
                <span id="summaryMatch">RCB vs CSK</span>
            </p>

            <p><strong>Stand:</strong>
                <span id="summaryStand">General</span>
            </p>

            <p><strong>Quantity:</strong>
                <span id="summaryQuantity">1</span>
            </p>

            <hr>

            <h3>Total Price: ₹<span id="totalPrice">500</span></h3>
        </section>

    </main>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>

    <footer>
        <p>© 2026 IPL Ticket Booking | Activity 7</p>
    </footer>

    <script src="app.js"></script>
</body>
</html>
